name: Versioning only
# Releases are intentionally manual. Tags never build or upload APKs/modules.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: echo 'Use commits for versioning. No release assets are generated.'
